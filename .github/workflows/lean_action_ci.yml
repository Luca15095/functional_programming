name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      - name: Check for sorry, axiom and native_decide
        run: "! grep -rnw --include='*.lean' -e sorry -e axiom -e native_decide RegexDeriv RegexDeriv.lean"
